<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Felicek — App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app"></div>

    <!-- ─── APK Modal (shared, also handled by script.js) ─── -->
    <div class="modal-overlay" id="apkModal">
        <div class="modal">
            <button class="close-btn" id="apkModalClose">&times;</button>
            <div class="icon"><i class="fas fa-file-download"></i></div>
            <h3>Download Felicek APK</h3>
            <p>Version 2.1.0 · 12 MB · Android 7+</p>
            <div class="btn-group">
                <a href="#" class="btn btn-primary" id="apkDownloadLink"><i class="fas fa-download"></i> Download</a>
                <button class="btn btn-outline" id="apkModalCancel">Cancel</button>
            </div>
            <div class="hash"><i class="fas fa-shield-alt"></i> SHA-256: 5f4d…a9c2</div>
        </div>
    </div>

    <script>
        // ─── Full App Logic ─────────────────────────────────────────────
        (function() {
            'use strict';

            // ─── STATE ───────────────────────────────────────────────────
            const DEFAULT_STATE = {
                screen: 'onboarding',
                role: 'freelancer',
                activeTab: 'home',
                profile: {
                    fullName: 'Sadia R.',
                    title: 'Flutter Developer & UI Engineer',
                    bio: 'I build polished, production-ready Flutter apps for fintech and logistics startups. 5 years of experience.',
                    location: 'Dhaka, Bangladesh',
                    skills: ['Flutter', 'Dart', 'Firebase', 'UI/UX', 'REST APIs'],
                    hourlyRate: 28,
                },
                kyc: {
                    nidUploaded: false,
                    birthCertUploaded: false,
                    depositPaid: false,
                },
                jobs: [{
                    id: 1,
                    type: 'freelance',
                    typeLabel: 'Freelance',
                    title: 'Design a Flutter Onboarding Flow',
                    summary: '5 polished onboarding screens for a fintech app, dark theme, Material 3.',
                    budget: '$450',
                    trustScore: 98,
                    escrowFunded: true,
                    hasChallenge: true,
                    skills: ['Flutter', 'UI/UX', 'Figma'],
                    posted: '2h ago',
                    postedBy: 'client',
                    milestones: [{ label: 'Wireframes approved', amount: '$100' }, { label: 'High-fidelity screens',
                        amount: '$250' }, { label: 'Final handoff', amount: '$100' }],
                    challengePrompt: 'Recreate this bottom-sheet component spec in Flutter within 4 minutes.',
                }, {
                    id: 2,
                    type: 'agency',
                    typeLabel: 'Agency',
                    title: 'Full Backend Rebuild for Logistics SaaS',
                    summary: 'Multi-month engagement for a 3-person team: API + infra rebuild.',
                    budget: '$12,000',
                    trustScore: 95,
                    escrowFunded: true,
                    hasChallenge: false,
                    skills: ['Node.js', 'PostgreSQL', 'AWS'],
                    posted: '6h ago',
                    postedBy: 'agency',
                    milestones: [{ label: 'Architecture proposal', amount: '$2,000' }, { label: 'Core API migration',
                        amount: '$6,000' }, { label: 'Go-live + handover', amount: '$4,000' }],
                    challengePrompt: 'No live challenge required — portfolio review instead.',
                }, {
                    id: 3,
                    type: 'startup',
                    typeLabel: 'Startup · Equity',
                    title: 'Founding Mobile Engineer (Equity + Micro-milestones)',
                    summary: 'Pre-seed startup looking for a founding engineer, part equity + part milestone pay.',
                    budget: '0.5% Equity + $2,000',
                    trustScore: 91,
                    escrowFunded: true,
                    hasChallenge: true,
                    skills: ['Flutter', 'Firebase', 'Growth'],
                    posted: '1d ago',
                    postedBy: 'startup',
                    milestones: [{ label: 'MVP core screens', amount: '$800' }, { label: 'Auth + payments',
                        amount: '$700' }, { label: 'Public beta launch', amount: '$500' }],
                    challengePrompt: 'Ship a working counter widget with persisted state in Flutter — 4 minute timed test.',
                }, {
                    id: 4,
                    type: 'freelance',
                    typeLabel: 'Freelance',
                    title: 'Write 10 SEO Blog Posts for SaaS Startup',
                    summary: 'B2B SaaS company needs long-form technical content, 1200 words each.',
                    budget: '$600',
                    trustScore: 89,
                    escrowFunded: true,
                    hasChallenge: true,
                    skills: ['SEO', 'Copywriting'],
                    posted: '1d ago',
                    postedBy: 'client',
                    milestones: [{ label: '3 posts delivered', amount: '$180' }, { label: '6 more posts',
                        amount: '$360' }, { label: 'Final post + revisions', amount: '$60' }],
                    challengePrompt: 'Write a 150-word intro paragraph on a given DevOps topic in 4 minutes.',
                }, {
                    id: 5,
                    type: 'agency',
                    typeLabel: 'Agency',
                    title: 'Brand Identity for Retail Chain Relaunch',
                    summary: 'Full brand refresh: logo, packaging, and 20-page brand guideline doc.',
                    budget: '$8,500',
                    trustScore: 93,
                    escrowFunded: true,
                    hasChallenge: false,
                    skills: ['Branding', 'Illustrator'],
                    posted: '2d ago',
                    postedBy: 'agency',
                    milestones: [{ label: 'Concept directions', amount: '$1,500' }, { label: 'Final identity system',
                        amount: '$4,500' }, { label: 'Guideline doc + assets', amount: '$2,500' }],
                    challengePrompt: 'Portfolio-based review — no live test for this listing.',
                }, {
                    id: 6,
                    type: 'startup',
                    typeLabel: 'Startup · Equity',
                    title: 'Growth Marketer — Early Traction Sprint',
                    summary: 'Seed-stage startup needs a growth lead for a 6-week user acquisition sprint.',
                    budget: '0.3% Equity + $1,200',
                    trustScore: 87,
                    escrowFunded: true,
                    hasChallenge: true,
                    skills: ['Growth', 'Paid Ads'],
                    posted: '3d ago',
                    postedBy: 'startup',
                    milestones: [{ label: 'Channel strategy', amount: '$400' }, { label: 'Campaign execution',
                        amount: '$500' }, { label: 'Results report', amount: '$300' }],
                    challengePrompt: 'Draft a 3-bullet acquisition channel plan for a given app in 4 minutes.',
                }],
                proposals: {},
                transactions: [
                    { label: 'Escrow release — Blog Posts job', time: '2d ago', amount: '+$540.00',
                    positive: true },
                    { label: 'Platform maintenance fee (2%)', time: '2d ago', amount: '-$10.80', positive: false },
                    { label: 'Withdrawal to bKash', time: '5d ago', amount: '-$300.00', positive: false },
                ],
                selectedJobId: null,
                bidAmount: '',
                challengeStarted: false,
                newJob: {
                    title: '',
                    budget: '',
                    scope: '',
                    challengeEnabled: false,
                    challengePrompt: '',
                },
                filter: 'all',
                selectedMfs: 'bKash',
            };

            // ─── Load / Save State ──────────────────────────────────────
            function loadState() {
                try {
                    const saved = localStorage.getItem('felicek_state');
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        return deepMerge(DEFAULT_STATE, parsed);
                    }
                } catch (e) { /* ignore */ }
                return JSON.parse(JSON.stringify(DEFAULT_STATE));
            }

            function saveState(state) {
                try {
                    localStorage.setItem('felicek_state', JSON.stringify(state));
                } catch (e) { /* ignore */ }
            }

            function deepMerge(target, source) {
                const result = { ...target };
                for (const key in source) {
                    if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                        result[key] = deepMerge(target[key] || {}, source[key]);
                    } else {
                        result[key] = source[key];
                    }
                }
                return result;
            }

            let state = loadState();

            // ─── Helpers ─────────────────────────────────────────────────
            function getRoleLabel(role) {
                const map = { freelancer: 'Freelancer', client: 'Client', agency: 'Agency', startup: 'Startup' };
                return map[role] || role;
            }

            function getJobs() { return state.jobs; }

            function getFilteredJobs() {
                const all = getJobs();
                if (state.filter === 'all') return all;
                return all.filter(j => j.type === state.filter);
            }

            function getJob(id) { return state.jobs.find(j => j.id === id); }

            function isFreelancer() { return state.role === 'freelancer'; }

            // ─── Render Engine ───────────────────────────────────────────
            function render() {
                const app = document.getElementById('app');
                const s = state;
                const roleLabel = getRoleLabel(s.role);

                // ── Header ──
                let headerHtml = `
              <header class="app-header">
                <div class="logo" id="logoHome">
                  <span>Felicek</span>
                  <span class="dot"></span>
                </div>
                <div class="right">
                  <span class="role-badge"><i class="fas fa-circle" style="font-size:6px;"></i> ${roleLabel}</span>
                  <button class="download-apk-btn" id="headerDownloadBtn"><i class="fas fa-download"></i> <span>APK</span></button>
                </div>
              </header>
            `;

                // ── Bottom Nav ──
                const tabs = [
                    { id: 'home', icon: 'fa-home', label: 'Home' },
                    { id: 'proposals', icon: 'fa-file-alt', label: 'Proposals' },
                    { id: 'vault', icon: 'fa-wallet', label: 'Payment' },
                    { id: 'profile', icon: 'fa-user', label: 'Profile' },
                ];
                let bottomNavHtml = `
              <nav class="bottom-nav">
                ${tabs.map(t => `
                  <button class="tab ${s.activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">
                    <i class="fas ${t.icon}"></i>
                    ${t.label}
                  </button>
                `).join('')}
              </nav>
            `;

                // ── Main Content ──
                let mainHtml = '';

                // ---- SCREEN: onboarding ----
                if (s.screen === 'onboarding') {
                    mainHtml = `
                <div class="onboarding-container">
                  <div class="icon-circle"><div class="dot-ring"></div></div>
                  <h1>Felicek</h1>
                  <div class="sub">Verified talent. Zero spam.<br>Fair fees, always.</div>
                  <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);font-weight:600;margin-bottom:8px;">Choose your account</div>
                  ${[
                        { key: 'freelancer', label: 'Freelancer', desc: 'Find verified gigs, take skill challenges' },
                        { key: 'client', label: 'Individual Client', desc: 'Post jobs, hire with escrow protection' },
                        { key: 'agency', label: 'Agency', desc: 'Multi-seat team, bulk listings, shared escrow' },
                        { key: 'startup', label: 'Startup', desc: 'Fast-track hiring, equity-based roles' }
                    ].map(r => `
                      <div class="role-option ${s.role === r.key ? 'active' : ''}" data-role="${r.key}">
                        <div>
                          <div class="label">${r.label}</div>
                          <div class="desc">${r.desc}</div>
                        </div>
                        <div class="dot"></div>
                      </div>
                    `).join('')}
                  <button class="btn btn-primary btn-block mt-16" id="startVerifyBtn">Continue to Verification</button>
                  <div style="font-size:10.5px;color:var(--text-muted);line-height:1.6;margin-top:12px;text-align:center;">Identity verification is required for every account. Freelancer accounts additionally require a refundable $20 trust deposit.</div>
                </div>
              `;
                }

                // ---- SCREEN: profileSetup ----
                else if (s.screen === 'profileSetup') {
                    const p = s.profile;
                    mainHtml = `
                <div class="onboarding-container">
                  <h2 style="font-family:var(--font-serif);font-size:28px;font-weight:600;text-align:center;">Build Your Profile</h2>
                  <div style="font-size:12px;color:var(--text-secondary);text-align:center;margin:8px 0 20px;">A few quick questions so clients and freelancers know who they're working with.</div>
                  <div class="form-group">
                    <label>Full name</label>
                    <input type="text" id="profileFullName" value="${p.fullName || ''}" placeholder="e.g. Sadia Rahman" />
                  </div>
                  <div class="form-group">
                    <label>Professional title</label>
                    <input type="text" id="profileTitle" value="${p.title || ''}" placeholder="e.g. Flutter Developer" />
                  </div>
                  <div class="form-group">
                    <label>Short bio</label>
                    <textarea id="profileBio" placeholder="Tell clients what you do best">${p.bio || ''}</textarea>
                  </div>
                  <div class="form-group">
                    <label>Primary skills (comma separated)</label>
                    <input type="text" id="profileSkills" value="${(p.skills || []).join(', ')}" placeholder="e.g. Flutter, Firebase, UI/UX" />
                  </div>
                  <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="profileLocation" value="${p.location || ''}" placeholder="e.g. Dhaka, Bangladesh" />
                  </div>
                  ${isFreelancer() ? `
                    <div class="form-group">
                      <label>Hourly rate (USD)</label>
                      <input type="number" id="profileRate" value="${p.hourlyRate || ''}" placeholder="e.g. 28" />
                    </div>
                  ` : ''}
                  <button class="btn btn-primary btn-block" id="finishProfileBtn">Continue to Verification</button>
                </div>
              `;
                }

                // ---- SCREEN: kyc ----
                else if (s.screen === 'kyc') {
                    const k = s.kyc;
                    const progress = k.depositPaid ? 100 : (k.nidUploaded ? 60 : 20);
                    mainHtml = `
                <div class="onboarding-container">
                  <h2 style="font-family:var(--font-serif);font-size:26px;font-weight:600;">Verification</h2>
                  <div style="font-size:12px;color:var(--text-secondary);margin:4px 0 12px;">Step 1 of ${isFreelancer() ? 2 : 1}</div>
                  <div class="progress-bar"><div class="fill" style="width:${progress}%;"></div></div>

                  <div class="kyc-step" id="nidStep">
                    <div>
                      <div style="font-size:13px;font-weight:500;">National ID (NID)</div>
                      <div style="font-size:10.5px;color:var(--text-muted);">Encrypted · never shown</div>
                    </div>
                    <span class="status ${k.nidUploaded ? 'status-verified' : 'status-pending'}">${k.nidUploaded ? 'Verified' : 'Upload'}</span>
                  </div>

                  <div class="kyc-step" id="birthStep">
                    <div>
                      <div style="font-size:13px;font-weight:500;">Birth Certificate</div>
                      <div style="font-size:10.5px;color:var(--text-muted);">Optional secondary</div>
                    </div>
                    <span class="status ${k.birthCertUploaded ? 'status-verified' : 'status-pending'}">${k.birthCertUploaded ? 'Uploaded' : 'Upload'}</span>
                  </div>

                  ${isFreelancer() ? `
                    <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);font-weight:600;margin:16px 0 8px;">$20 Security Deposit</div>
                    <div style="background:var(--brand-teal-light);border:1px solid rgba(13,148,136,0.3);border-radius:16px;padding:18px;">
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                        <span style="font-size:26px;font-weight:700;color:var(--text-primary);">$20.00</span>
                        <span style="font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:8px;background:${k.depositPaid ? '#fbf1de' : '#f2f0ea'};color:${k.depositPaid ? '#d4a017' : 'var(--text-secondary)'};">${k.depositPaid ? 'Locked · Refundable' : (k.nidUploaded ? 'Ready to Pay' : 'Verify ID First')}</span>
                      </div>
                      <div style="font-size:11.5px;color:var(--text-secondary);line-height:1.6;margin-bottom:12px;">
                        ${k.depositPaid ? 'Your deposit is securely locked and becomes fully withdrawable after your first completed job.' : 'Complete NID verification, then pay your refundable $20 deposit to unlock full freelancer access.'}
                      </div>
                      <div class="payout-methods">
                        ${['bKash','Nagad','PayPal','Bank'].map(m => `
                          <span class="method ${s.selectedMfs === m ? 'active' : ''}" data-mfs="${m}">${m}</span>
                        `).join('')}
                      </div>
                      <button class="btn ${k.depositPaid ? 'btn-outline' : (k.nidUploaded ? 'btn-teal' : 'btn-outline')} btn-block" id="payDepositBtn" ${k.depositPaid ? 'disabled' : ''}>
                        ${k.depositPaid ? '✓ Deposit Locked' : (k.nidUploaded ? 'Pay $20 Deposit' : 'Verify NID first')}
                      </button>
                    </div>
                    <div style="font-size:10.5px;color:var(--text-muted);line-height:1.6;margin-top:8px;">Fully refundable after your first successfully completed job. Platform maintenance fee is a flat 1%–2%.</div>
                  ` : ''}

                  <button class="btn btn-primary btn-block mt-16" id="finishKycBtn">
                    ${isFreelancer() ? (k.depositPaid ? 'Continue' : (k.nidUploaded ? 'Skip Deposit For Now' : 'Continue')) : 'Continue'}
                  </button>
                </div>
              `;
                }

                // ---- SCREEN: home ----
                else if (s.screen === 'home') {
                    const jobs = getFilteredJobs();
                    const isF = isFreelancer();
                    const roleToType = { client: 'freelance', agency: 'agency', startup: 'startup' };
                    const displayJobs = isF ? jobs : jobs.filter(j => j.type === roleToType[s.role]);

                    mainHtml = `
                <div class="flex flex-col" style="gap:12px;">
                  ${isF ? `
                    <div style="background:var(--brand-teal-light);border:1px solid rgba(13,148,136,0.25);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;">
                      <div style="display:flex;align-items:center;gap:8px;">
                        <div style="width:8px;height:8px;border-radius:50%;background:${s.kyc.depositPaid ? '#0d9488' : '#d4a017'};"></div>
                        <div style="font-size:11.5px;color:var(--brand-teal-dark);">Trust Fund Vault · <strong>$20.00</strong></div>
                      </div>
                      <div style="font-size:10.5px;font-weight:600;color:var(--brand-teal);">${s.kyc.depositPaid ? 'Withdrawable ›' : 'Locked ›'}</div>
                    </div>
                  ` : `
                    <div style="display:flex;align-items:center;gap:8px;background:#f2f0ea;border-radius:12px;padding:10px 12px;">
                      <i class="fas fa-search" style="color:var(--text-muted);"></i>
                      <span style="font-size:12.5px;color:var(--text-muted);">Search jobs, skills, or clients...</span>
                    </div>
                  `}

                  <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;">
                    ${['all','freelance','agency','startup'].map(f => `
                      <span class="pill ${s.filter === f ? 'pill-teal' : 'pill-gray'}" style="cursor:pointer;padding:6px 14px;border-radius:20px;font-size:11.5px;font-weight:500;" data-filter="${f}">${f === 'all' ? 'All' : f.charAt(0).toUpperCase()+f.slice(1)}</span>
                    `).join('')}
                  </div>

                  ${displayJobs.length === 0 ? `
                    <div style="text-align:center;padding:40px 0;color:var(--text-muted);">
                      <i class="fas fa-inbox" style="font-size:32px;display:block;margin-bottom:8px;"></i>
                      No jobs match your filter.
                      ${!isF ? `<button class="btn btn-teal btn-sm mt-8" id="postNewJobBtn">+ Post a Job</button>` : ''}
                    </div>
                  ` : displayJobs.map(j => `
                    <div class="job-card" data-job="${j.id}">
                      <div class="top">
                        <span class="tag">${j.typeLabel}</span>
                        <span class="budget">${j.budget}</span>
                      </div>
                      <div class="job-title">${j.title}</div>
                      <div class="summary">${j.summary}</div>
                      <div class="skills">${j.skills.map(sk => `<span class="skill">${sk}</span>`).join('')}</div>
                      <div class="meta">
                        <span class="pill pill-teal">${j.trustScore}% Verified</span>
                        ${j.escrowFunded ? '<span class="pill pill-blue">Escrow Funded</span>' : ''}
                        ${j.hasChallenge ? '<span class="pill pill-purple">Skill Test</span>' : ''}
                      </div>
                    </div>
                  `).join('')}

                  ${!isF ? `
                    <button class="btn btn-teal btn-block mt-8" id="postNewJobBtn"><i class="fas fa-plus"></i> Post a New Job</button>
                  ` : ''}
                </div>
              `;
                }

                // ---- SCREEN: jobDetail ----
                else if (s.screen === 'jobDetail') {
                    const job = getJob(s.selectedJobId);
                    if (!job) {
                        mainHtml = `<div>Job not found. <button class="btn btn-primary btn-sm" id="backHomeFromDetail">Go back</button></div>`;
                    } else {
                        const isF = isFreelancer();
                        const submitted = !!s.proposals[job.id];
                        const challengeDone = s.challengeStarted;
                        mainHtml = `
                  <div>
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                      <button class="btn btn-outline btn-sm" id="backHomeFromDetail"><i class="fas fa-arrow-left"></i> Back</button>
                      <span class="tag">${job.typeLabel}</span>
                    </div>
                    <div style="font-family:var(--font-serif);font-size:22px;font-weight:600;color:var(--text-primary);line-height:1.3;">${job.title}</div>
                    <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">${job.budget} · Posted ${job.posted}</div>

                    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
                      <span class="pill pill-teal">${job.trustScore}% Client Trust</span>
                      <span class="pill pill-blue">Escrow Verified</span>
                      ${isF ? `<span class="pill pill-gray">${Math.floor(Math.random()*10)+3} Applicants</span>` : ''}
                    </div>

                    <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);font-weight:600;">Project Scope</div>
                    <div style="font-size:14px;line-height:1.7;color:#2b3340;margin-bottom:16px;">${job.summary} ${job.type === 'startup' ? 'This role offers equity-based milestone pay.' : ''}</div>

                    <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);font-weight:600;">Milestones</div>
                    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;">
                      ${job.milestones.map(m => `
                        <div style="display:flex;justify-content:space-between;align-items:center;background:#f9f8f5;border:1px solid rgba(27,36,48,0.06);border-radius:10px;padding:10px 14px;">
                          <span style="font-size:12.5px;color:var(--text-primary);">${m.label}</span>
                          <span style="font-size:12.5px;font-weight:600;color:var(--brand-teal-dark);">${m.amount}</span>
                        </div>
                      `).join('')}
                    </div>

                    ${isF ? `
                      <div style="background:var(--brand-purple-light);border:1px solid rgba(134,89,201,0.25);border-radius:14px;padding:14px;margin-bottom:12px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                          <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--brand-purple);font-weight:600;">Live Skill Challenge</span>
                          <span style="font-size:9.5px;color:var(--text-muted);">4 min preview</span>
                        </div>
                        <div style="font-size:12.5px;color:var(--text-primary);line-height:1.6;margin-bottom:10px;">${job.hasChallenge ? job.challengePrompt : 'No live challenge required — portfolio review instead.'}</div>
                        <button class="btn ${challengeDone ? 'btn-outline' : 'btn-primary'} btn-block" id="startChallengeBtn" ${challengeDone ? 'disabled' : ''}>${challengeDone ? '✓ Challenge Completed' : 'Start 4-Minute Challenge'}</button>
                      </div>

                      <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);font-weight:600;">Your Bid</div>
                      <input type="text" id="bidInput" value="${s.bidAmount}" placeholder="Enter your bid amount" style="margin-bottom:10px;" />
                      <button class="btn ${submitted ? 'btn-outline' : 'btn-primary'} btn-block" id="submitProposalBtn" ${submitted ? 'disabled' : ''}>${submitted ? '✓ Proposal Submitted' : 'Submit Proposal'}</button>
                    ` : `
                      <div style="display:flex;gap:10px;">
                        <button class="btn btn-primary" style="flex:1;" id="editListingBtn">Edit Listing</button>
                        <button class="btn btn-danger" style="flex:1;" id="closeListingBtn">Close Listing</button>
                      </div>
                    `}
                  </div>
                `;
                    }
                }

                // ---- SCREEN: proposals ----
                else if (s.screen === 'proposals') {
                    const isF = isFreelancer();
                    const proposalsList = isF ? Object.values(s.proposals) : [
                        { jobTitle: 'Design a Flutter Onboarding Flow', note: 'From verified freelancer · 98% trust score',
                            amount: '$430 bid', status: 'Passed Filter', statusColor: 'var(--brand-teal)' },
                        { jobTitle: 'Full Backend Rebuild for Logistics SaaS', note: 'Agency with 3 verified engineers',
                            amount: '$11,200 bid', status: 'Passed Filter', statusColor: 'var(--brand-teal)' },
                        { jobTitle: 'Brand Identity for Retail Chain', note: 'Generic proposal — no project-specific details',
                            amount: '$8,500', status: 'Flagged Spam', statusColor: '#b8382f' },
                    ];

                    mainHtml = `
                <div style="display:flex;flex-direction:column;gap:12px;">
                  ${isF ? `
                    <div style="background:var(--brand-teal-light);border:1px solid rgba(13,148,136,0.2);border-radius:9px;padding:8px 12px;display:flex;align-items:center;gap:8px;">
                      <i class="fas fa-robot" style="color:var(--brand-teal);"></i>
                      <span style="font-size:10.5px;color:var(--brand-teal-dark);">AI spam filter blocked 23 generic proposals this week</span>
                    </div>
                  ` : ''}

                  ${proposalsList.length === 0 ? `
                    <div style="text-align:center;padding:40px 0;color:var(--text-muted);">
                      <i class="fas fa-inbox" style="font-size:32px;display:block;margin-bottom:8px;"></i>
                      No proposals yet.
                    </div>
                  ` : proposalsList.map(p => `
                    <div style="background:var(--surface-white);border:1px solid var(--border-subtle);border-radius:14px;padding:13px 14px;">
                      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
                        <span style="font-size:13px;font-weight:600;color:var(--text-primary);">${p.jobTitle || 'Job'}</span>
                        <span style="font-size:10px;font-weight:600;padding:3px 10px;border-radius:8px;background:${p.statusColor || 'var(--brand-teal)'}15;color:${p.statusColor || 'var(--brand-teal)'};">${p.status || 'Submitted'}</span>
                      </div>
                      <div style="font-size:11.5px;color:var(--text-secondary);line-height:1.5;">${p.note || ''}</div>
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
                        <span style="font-size:12px;font-weight:600;color:var(--brand-teal-dark);">${p.amount || ''}</span>
                        <span style="font-size:10.5px;color:var(--text-muted);">just now</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `;
                }

                // ---- SCREEN: vault ----
                else if (s.screen === 'vault') {
                    const k = s.kyc;
                    mainHtml = `
                <div>
                  <div class="wallet-card">
                    <div class="balance-label">Available Balance</div>
                    <div class="balance">$1,240.50</div>
                    <div class="actions">
                      <button class="btn-withdraw" id="withdrawBtn">Withdraw</button>
                      <button class="btn-add" id="addFundsBtn">Add Funds</button>
                    </div>
                  </div>

                  <div class="vault-card">
                    <div class="vault-header">
                      <span class="label">Trust Fund Vault</span>
                      <span class="status ${k.depositPaid ? 'status-verified' : 'status-pending'}">${k.depositPaid ? 'Withdrawable' : 'Locked'}</span>
                    </div>
                    <div class="vault-amount">$20.00</div>
                    <div class="vault-desc">${k.depositPaid ? 'Fully withdrawable. Great work on your first completed job!' : 'Refundable deposit — unlocks after your first successful job completion.'}</div>
                  </div>

                  <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);font-weight:600;margin-top:12px;">Payout Method</div>
                  <div class="payout-methods">
                    ${['bKash','Nagad','PayPal','Bank'].map(m => `
                      <span class="method ${s.selectedMfs === m ? 'active' : ''}" data-mfs="${m}">${m}</span>
                    `).join('')}
                  </div>
                  <div style="font-size:10.5px;color:var(--text-muted);line-height:1.6;margin-bottom:16px;">Direct local payouts with zero platform markup, or PayPal for international — only 1–2% maintenance fee.</div>

                  <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);font-weight:600;">Recent Activity</div>
                  ${s.transactions.map(t => `
                    <div class="transaction-item">
                      <div class="info">
                        <div class="label">${t.label}</div>
                        <div class="time">${t.time}</div>
                      </div>
                      <span class="amount ${t.positive ? 'amount-positive' : 'amount-negative'}">${t.amount}</span>
                    </div>
                  `).join('')}
                </div>
              `;
                }

                // ---- SCREEN: profile ----
                else if (s.screen === 'profile') {
                    const p = s.profile;
                    const stats = isFreelancer() ?
                        { jobSuccess: '98%', earned: '$18.4K', jobsDone: '14' } :
                        { jobSuccess: '96%', earned: '$9.2K', jobsDone: '6' };
                    const reviews = [
                        { project: 'Onboarding Flow Redesign', rating: '★★★★★',
                            text: 'Sadia delivered ahead of schedule with pixel-perfect screens.', client: 'FinNova Client',
                            amount: '$450' },
                        { project: 'Logistics App Bug Sprint', rating: '★★★★★',
                            text: 'Fixed 20+ critical bugs in under a week.', client: 'CargoLink Client',
                            amount: '$620' },
                    ];

                    mainHtml = `
                <div>
                  <div class="profile-header">
                    <div class="profile-top">
                      <div class="avatar"></div>
                      <div>
                        <div class="name">${p.fullName || 'Your Name'}</div>
                        <div class="title">${p.title || 'Your title'}</div>
                        <div class="location">${p.location || 'Your location'}</div>
                      </div>
                      <div class="edit-btn" id="editProfileBtn">Edit</div>
                    </div>
                  </div>

                  <div class="profile-stats">
                    <div class="stat"><div class="value">${stats.jobSuccess}</div><div class="label">Job Success</div></div>
                    <div class="stat"><div class="value">${stats.earned}</div><div class="label">Total Earned</div></div>
                    <div class="stat"><div class="value">${stats.jobsDone}</div><div class="label">Jobs Done</div></div>
                  </div>

                  <div style="background:var(--surface-white);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:16px;margin-bottom:16px;">
                    <div style="font-size:13px;line-height:1.7;color:#2b3340;margin-bottom:8px;">${p.bio || 'No bio yet.'}</div>
                    <div class="profile-skills">
                      ${(p.skills || []).map(sk => `<span class="skill-tag">${sk}</span>`).join('')}
                    </div>
                  </div>

                  <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);font-weight:600;margin-bottom:8px;">Work History & Reviews</div>
                  ${reviews.map(r => `
                    <div class="review-item">
                      <div class="review-top">
                        <span class="project">${r.project}</span>
                        <span class="rating">${r.rating}</span>
                      </div>
                      <div class="review-text">${r.text}</div>
                      <div class="review-meta">${r.client} · ${r.amount}</div>
                    </div>
                  `).join('')}

                  <div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface-white);border:1px solid var(--border-subtle);border-radius:14px;padding:14px 16px;cursor:pointer;margin:12px 0;" id="goToKyc">
                    <div>
                      <div style="font-size:12.5px;color:var(--text-muted);">Verification</div>
                      <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-top:2px;">KYC &amp; Deposit Vault</div>
                    </div>
                    <span style="font-size:12px;color:var(--brand-teal-dark);font-weight:600;">Manage ›</span>
                  </div>

                  <div style="background:var(--surface-white);border:1px solid var(--border-subtle);border-radius:14px;overflow:hidden;margin-bottom:16px;">
                    <div style="padding:13px 14px;font-size:13px;color:var(--text-primary);border-bottom:1px solid var(--border-subtle);">Notification preferences</div>
                    <div style="padding:13px 14px;font-size:13px;color:var(--text-primary);border-bottom:1px solid var(--border-subtle);">Privacy &amp; data</div>
                    <div style="padding:13px 14px;font-size:13px;color:#b8382f;cursor:pointer;" id="logoutBtn">Log out</div>
                  </div>

                  <button class="btn btn-primary btn-block" id="switchRoleBtn">Switch Account Type</button>
                </div>
              `;
                }

                // ---- SCREEN: postJob ----
                else if (s.screen === 'postJob') {
                    const nj = s.newJob;
                    mainHtml = `
                <div>
                  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
                    <button class="btn btn-outline btn-sm" id="backFromPostJob"><i class="fas fa-arrow-left"></i> Back</button>
                    <span style="font-size:16px;font-weight:600;">Post a New Job</span>
                  </div>
                  <div class="form-group">
                    <label>Job title</label>
                    <input type="text" id="newJobTitle" value="${nj.title}" placeholder="e.g. Redesign onboarding flow" />
                  </div>
                  <div class="form-group">
                    <label>Budget</label>
                    <input type="text" id="newJobBudget" value="${nj.budget}" placeholder="e.g. $500 or 0.5% Equity + $1,000" />
                  </div>
                  <div class="form-group">
                    <label>Scope</label>
                    <textarea id="newJobScope" placeholder="Describe the work in detail">${nj.scope}</textarea>
                  </div>
                  <div style="background:var(--brand-purple-light);border:1px solid rgba(134,89,201,0.25);border-radius:14px;padding:16px;margin-bottom:16px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                      <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--brand-purple);font-weight:600;">Live Skill Challenge</span>
                      <button class="btn ${nj.challengeEnabled ? 'btn-primary' : 'btn-outline'} btn-sm" id="toggleChallengeBtn">${nj.challengeEnabled ? 'Enabled' : 'Add Challenge'}</button>
                    </div>
                    ${nj.challengeEnabled ? `
                      <div class="form-group">
                        <label>Challenge prompt</label>
                        <textarea id="newJobChallenge" placeholder="e.g. Build a working counter widget with persisted state in 4 minutes">${nj.challengePrompt}</textarea>
                      </div>
                    ` : ''}
                  </div>
                  <button class="btn btn-primary btn-block" id="publishJobBtn">Publish Job</button>
                </div>
              `;
                }

                // ── Assemble ──
                app.innerHTML = `
              ${headerHtml}
              <div class="main-content">${mainHtml}</div>
              ${bottomNavHtml}
            `;

                // ─── BIND EVENTS ─────────────────────────────────────────

                // Header: logo -> home
                const logo = document.getElementById('logoHome');
                if (logo) logo.addEventListener('click', () => navigate('home'));

                // Header: download APK (will be handled by shared script, but we also bind here)
                const headerDownload = document.getElementById('headerDownloadBtn');
                if (headerDownload) headerDownload.addEventListener('click', openApkModal);

                // Bottom nav tabs
                document.querySelectorAll('.bottom-nav .tab').forEach(tab => {
                    tab.addEventListener('click', function() {
                        const tabId = this.dataset.tab;
                        if (tabId === 'home') navigate('home');
                        else if (tabId === 'proposals') navigate('proposals');
                        else if (tabId === 'vault') navigate('vault');
                        else if (tabId === 'profile') navigate('profile');
                    });
                });

                // Onboarding: role selection
                document.querySelectorAll('.role-option').forEach(el => {
                    el.addEventListener('click', function() {
                        const role = this.dataset.role;
                        state.role = role;
                        saveState(state);
                        render();
                    });
                });

                // Onboarding: start verify
                const startVerify = document.getElementById('startVerifyBtn');
                if (startVerify) {
                    startVerify.addEventListener('click', () => {
                        navigate('profileSetup');
                    });
                }

                // Profile setup: finish
                const finishProfile = document.getElementById('finishProfileBtn');
                if (finishProfile) {
                    finishProfile.addEventListener('click', () => {
                        const fullName = document.getElementById('profileFullName')?.value || '';
                        const title = document.getElementById('profileTitle')?.value || '';
                        const bio = document.getElementById('profileBio')?.value || '';
                        const skills = document.getElementById('profileSkills')?.value || '';
                        const location = document.getElementById('profileLocation')?.value || '';
                        const rate = document.getElementById('profileRate')?.value || '';
                        state.profile.fullName = fullName;
                        state.profile.title = title;
                        state.profile.bio = bio;
                        state.profile.skills = skills.split(',').map(s => s.trim()).filter(Boolean);
                        state.profile.location = location;
                        if (rate) state.profile.hourlyRate = Number(rate);
                        saveState(state);
                        navigate('kyc');
                    });
                }

                // KYC: NID step
                const nidStep = document.getElementById('nidStep');
                if (nidStep) {
                    nidStep.addEventListener('click', () => {
                        state.kyc.nidUploaded = !state.kyc.nidUploaded;
                        saveState(state);
                        render();
                    });
                }
                const birthStep = document.getElementById('birthStep');
                if (birthStep) {
                    birthStep.addEventListener('click', () => {
                        state.kyc.birthCertUploaded = !state.kyc.birthCertUploaded;
                        saveState(state);
                        render();
                    });
                }

                // KYC: payout method selection
                document.querySelectorAll('.method').forEach(el => {
                    el.addEventListener('click', function() {
                        state.selectedMfs = this.dataset.mfs;
                        saveState(state);
                        render();
                    });
                });

                // KYC: pay deposit
                const payDeposit = document.getElementById('payDepositBtn');
                if (payDeposit) {
                    payDeposit.addEventListener('click', () => {
                        if (state.kyc.nidUploaded && !state.kyc.depositPaid) {
                            state.kyc.depositPaid = true;
                            saveState(state);
                            render();
                        }
                    });
                }

                // KYC: finish
                const finishKyc = document.getElementById('finishKycBtn');
                if (finishKyc) {
                    finishKyc.addEventListener('click', () => {
                        navigate('home');
                    });
                }

                // Home: filter clicks
                document.querySelectorAll('[data-filter]').forEach(el => {
                    el.addEventListener('click', function() {
                        state.filter = this.dataset.filter;
                        saveState(state);
                        render();
                    });
                });

                // Home: job card clicks
                document.querySelectorAll('.job-card').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = Number(this.dataset.job);
                        state.selectedJobId = id;
                        state.challengeStarted = false;
                        state.bidAmount = '';
                        saveState(state);
                        navigate('jobDetail');
                    });
                });

                // Home: post new job
                document.querySelectorAll('#postNewJobBtn').forEach(el => {
                    el.addEventListener('click', () => {
                        navigate('postJob');
                    });
                });

                // Job detail: back
                const backFromDetail = document.getElementById('backHomeFromDetail');
                if (backFromDetail) {
                    backFromDetail.addEventListener('click', () => navigate('home'));
                }

                // Job detail: bid input
                const bidInput = document.getElementById('bidInput');
                if (bidInput) {
                    bidInput.addEventListener('input', function() {
                        state.bidAmount = this.value;
                        saveState(state);
                    });
                }

                // Job detail: submit proposal
                const submitProposal = document.getElementById('submitProposalBtn');
                if (submitProposal) {
                    submitProposal.addEventListener('click', () => {
                        if (!state.proposals[state.selectedJobId]) {
                            const job = getJob(state.selectedJobId);
                            state.proposals[state.selectedJobId] = {
                                jobTitle: job?.title || 'Job',
                                note: 'Proposal submitted',
                                amount: state.bidAmount || 'Bid TBD',
                                status: 'Submitted'
                            };
                            saveState(state);
                            render();
                        }
                    });
                }

                // Job detail: start challenge
                const startChallenge = document.getElementById('startChallengeBtn');
                if (startChallenge) {
                    startChallenge.addEventListener('click', () => {
                        state.challengeStarted = true;
                        saveState(state);
                        render();
                    });
                }

                // Job detail: edit/close (mock)
                const editBtn = document.getElementById('editListingBtn');
                if (editBtn) editBtn.addEventListener('click', () => alert('Edit listing functionality (mock).'));
                const closeBtn = document.getElementById('closeListingBtn');
                if (closeBtn) closeBtn.addEventListener('click', () => alert('Close listing functionality (mock).'));

                // Post job: back
                const backPost = document.getElementById('backFromPostJob');
                if (backPost) {
                    backPost.addEventListener('click', () => navigate('home'));
                }

                // Post job: toggle challenge
                const toggleChallenge = document.getElementById('toggleChallengeBtn');
                if (toggleChallenge) {
                    toggleChallenge.addEventListener('click', () => {
                        state.newJob.challengeEnabled = !state.newJob.challengeEnabled;
                        saveState(state);
                        render();
                    });
                }

                // Post job: publish
                const publishBtn = document.getElementById('publishJobBtn');
                if (publishBtn) {
                    publishBtn.addEventListener('click', () => {
                        const title = document.getElementById('newJobTitle')?.value || '';
                        const budget = document.getElementById('newJobBudget')?.value || '';
                        const scope = document.getElementById('newJobScope')?.value || '';
                        const challengePrompt = document.getElementById('newJobChallenge')?.value || '';
                        if (!title.trim()) {
                            alert('Please enter a job title.');
                            return;
                        }
                        const roleToType = { client: 'freelance', agency: 'agency', startup: 'startup' };
                        const type = roleToType[state.role] || 'freelance';
                        const typeLabel = state.role === 'startup' ? 'Startup · Equity' : state.role === 'agency' ?
                            'Agency' : 'Freelance';
                        const newJob = {
                            id: Date.now(),
                            type,
                            typeLabel,
                            title: title.trim(),
                            summary: scope.slice(0, 120),
                            budget: budget || 'TBD',
                            trustScore: 95,
                            escrowFunded: true,
                            hasChallenge: state.newJob.challengeEnabled,
                            skills: [],
                            posted: 'just now',
                            postedBy: state.role,
                            milestones: [{ label: 'Milestone 1', amount: 'TBD' }],
                            challengePrompt: state.newJob.challengeEnabled ? challengePrompt : '',
                        };
                        state.jobs.unshift(newJob);
                        state.newJob = { title: '', budget: '', scope: '', challengeEnabled: false,
                        challengePrompt: '' };
                        saveState(state);
                        navigate('home');
                        render();
                    });
                }

                // Profile: edit
                const editProfileBtn = document.getElementById('editProfileBtn');
                if (editProfileBtn) {
                    editProfileBtn.addEventListener('click', () => navigate('profileSetup'));
                }

                // Profile: go to KYC
                const goToKyc = document.getElementById('goToKyc');
                if (goToKyc) {
                    goToKyc.addEventListener('click', () => navigate('kyc'));
                }

                // Profile: logout
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', () => {
                        if (confirm('Log out and reset state?')) {
                            localStorage.removeItem('felicek_state');
                            state = JSON.parse(JSON.stringify(DEFAULT_STATE));
                            render();
                        }
                    });
                }

                // Profile: switch role
                const switchRole = document.getElementById('switchRoleBtn');
                if (switchRole) {
                    switchRole.addEventListener('click', () => {
                        const roles = ['freelancer', 'client', 'agency', 'startup'];
                        const idx = roles.indexOf(state.role);
                        const next = roles[(idx + 1) % roles.length];
                        state.role = next;
                        saveState(state);
                        render();
                    });
                }

                // Vault: withdraw / add funds (mock)
                const withdrawBtn = document.getElementById('withdrawBtn');
                if (withdrawBtn) {
                    withdrawBtn.addEventListener('click', () => alert('Withdraw functionality simulated.'));
                }
                const addFundsBtn = document.getElementById('addFundsBtn');
                if (addFundsBtn) {
                    addFundsBtn.addEventListener('click', () => alert('Add funds modal would appear.'));
                }

                // ── APK modal (re-bind because we re-render) ──
                // The global modal handlers in script.js will still work.
                // But we also bind header download button (already done).
            }

            // ─── Navigation ──────────────────────────────────────────────
            function navigate(screen) {
                state.screen = screen;
                if (['home', 'proposals', 'vault', 'profile'].includes(screen)) {
                    state.activeTab = screen;
                }
                saveState(state);
                render();
                const main = document.querySelector('.main-content');
                if (main) main.scrollTop = 0;
            }

            // ─── APK Modal (shared function, also in script.js) ─────────
            // We define it here to be safe.
            function openApkModal() {
                const modal = document.getElementById('apkModal');
                if (modal) modal.classList.add('open');
            }

            function closeApkModal() {
                const modal = document.getElementById('apkModal');
                if (modal) modal.classList.remove('open');
            }

            // ─── Initial Render ──────────────────────────────────────────
            render();

            // Expose for debugging
            window.__felicek = { state, render, navigate };
        })();
    </script>

    <!-- Shared scripts (modal, mobile menu, etc.) -->
    <script src="script.js"></script>
</body>
</html>
